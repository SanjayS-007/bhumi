# Domain validation rules as data (design doc M4.2). A ~150-line
# interpreter in assay/rule_engine.py evaluates these — deliberately not a
# generic expression language (no eval()), just two rule shapes: range
# and pair. match_on uses `qualifiers.stat` (min/max) so a real GR's
# Min-thickness is compared against Min-thickness, not against Max — see
# docs/REAL_DOC_FINDINGS.md #9.
rules:
  - id: thickness_range
    type: range
    applies_to: [seam_thickness_gross, seam_thickness_net]
    min: 0
    max: 50
    unit: m
    severity: block
    message: "{metric_key} must be between {min} and {max} {unit} (got {value})"

  - id: pct_range
    type: range
    applies_to: [coal_ash_pct, coal_moisture_pct, coal_vm_pct, coal_fc_pct]
    min: 0
    max: 100
    severity: block
    message: "{metric_key} must be 0-100% (got {value})"

  - id: net_le_gross
    type: pair
    metric_a: seam_thickness_net
    metric_b: seam_thickness_gross
    relation: le
    match_on: [entity_id, qualifiers.stat]
    severity: block
    message: "Net/effective thickness {a_value} exceeds gross/seam thickness {b_value} for {entity_id} — physically impossible, likely an OCR digit error"
    rationale: >
      Effective (net) coal thickness excludes dirt bands/partings within
      the seam and can never exceed the gross seam thickness by definition.
      A violation here is essentially always an extraction/transcription
      error, not a real geological finding — hence block, not warn.

  - id: ash_gcv_inverse
    type: pair
    metric_a: coal_ash_pct
    metric_b: coal_gcv
    relation: high_ash_high_gcv_implausible
    match_on: [entity_id, qualifiers.stat]
    severity: warn
    message: "High ash ({a_value}%) with high GCV ({b_value} kcal/kg) is geologically unusual — verify"
    rationale: >
      Geology has genuine exceptions (unusual mineral content, measurement
      method differences) — this is a heuristic prior, not a physical law.
      Blocking on it would make the system unusable and would rightly
      annoy a geologist reviewing a legitimate edge case. warn, not block.
