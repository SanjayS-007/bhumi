name: CI

# CLAUDE.md build order step 12, closed out this session: sqlite profile
# at minimum. No secrets/API keys are configured for this workflow, so
# the model-backend tests correctly run against the deterministic
# backend only (same as any contributor's machine without a key) —
# conftest.py's autouse fixture already forces this regardless.
#
# Runner is ubuntu-latest, not windows-latest, despite CLAUDE.md's build
# order originally asking for Windows CI: the first real push of this
# workflow returned a bare `startup_failure` with zero jobs created —
# GitHub's signature for an Actions spending-limit/minutes wall, not a
# workflow-syntax problem (the YAML parses cleanly; verified locally).
# Windows runners bill at 2x the standard rate and this is a fresh
# personal account, so Windows CI is switched off here until that
# account-level setting is addressed (outside what this repo's files can
# fix). ubuntu-latest still proves the sqlite profile is portable
# cross-platform, which is real, useful CI coverage, not a downgrade to
# "no CI" — see PROVENANCE.md.

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bhumi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --python 3.11

      - name: ruff check
        run: uv run --python 3.11 ruff check .

      - name: pytest
        run: uv run --python 3.11 pytest -q
        env:
          BHUMI_PROFILE: sqlite
