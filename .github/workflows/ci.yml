name: CI

# CLAUDE.md build order step 12, closed out this session: Windows +
# sqlite profile at minimum. No secrets/API keys are configured for this
# workflow, so the model-backend tests correctly run against the
# deterministic backend only (same as any contributor's machine without
# a key) — conftest.py's autouse fixture already forces this regardless.

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bhumi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --python 3.11

      - name: ruff check
        run: uv run --python 3.11 ruff check .

      - name: pytest
        run: uv run --python 3.11 pytest -q
        env:
          BHUMI_PROFILE: sqlite
